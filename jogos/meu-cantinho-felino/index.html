<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6b2fa0"><title>Meu Cantinho Felino · Patinhas Play</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#6b2fa0,#e9b9dc);font:600 16px system-ui;color:#3a1458}#boot{max-width:520px;margin:24px;padding:26px;background:#fff8;border:2px solid #fff;border-radius:22px;text-align:center;box-shadow:0 12px 40px #35104455}#boot strong{display:block;font-size:22px;margin-bottom:8px}#boot.error{background:#fff0f0;color:#7b1734}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div id="boot"><strong>🐾 Preparando o cantinho...</strong><p>Carregando Fúria, Suspiro, cenários e peças do jogo.</p></div><script>(async()=>{const boot=document.getElementById('boot');try{if(!window.JSZip)throw Error('Leitor do pacote indisponível. Verifique a conexão.');const res=await fetch('./meu-cantinho-felino.zip?v=20261127',{cache:'no-store'});if(!res.ok)throw Error('Pacote de recursos não encontrado (HTTP '+res.status+').');const zip=await JSZip.loadAsync(await res.arrayBuffer());const root='jogos/meu-cantinho-felino/';const assets={};const jobs=[];zip.forEach((path,file)=>{if(file.dir||!path.startsWith(root+'assets/'))return;jobs.push(file.async('blob').then(blob=>assets[path.slice(root.length)]=URL.createObjectURL(blob)))});await Promise.all(jobs);if(!assets['assets/characters/furia.webp']||!assets['assets/scenes/damaged.webp'])throw Error('O ZIP não contém os recursos essenciais.');window.ART=assets;const cr=await fetch('css/style.css?v=20261127');if(!cr.ok)throw Error('Falha ao carregar CSS.');const st=document.createElement('style');st.textContent=await cr.text();document.head.append(st);document.documentElement.style.setProperty('--scene-damaged','url("'+assets['assets/scenes/damaged.webp']+'")');document.documentElement.style.setProperty('--scene-restored','url("'+assets['assets/scenes/restored.webp']+'")');const hr=await fetch('game-shell.html?v=20261127');if(!hr.ok)throw Error('Falha ao carregar a estrutura HTML.');document.body.innerHTML=new DOMParser().parseFromString(await hr.text(),'text/html').body.innerHTML;for(const n of ['data.js','save.js','energy.js','board.js','orders.js','reforms.js','characters.js','ads.js','ui.js','main.js']){const r=await fetch('js/'+n+'?v=20261127');if(!r.ok)throw Error('Falha ao carregar js/'+n);const s=document.createElement('script');s.textContent=await r.text();document.body.append(s)}}catch(e){boot.classList.add('error');boot.innerHTML='<strong>Não conseguimos abrir o jogo 😿</strong><p>'+String(e.message||e)+'</p><p>Atualize a página em alguns instantes.</p>'}})();</script></body></html>
