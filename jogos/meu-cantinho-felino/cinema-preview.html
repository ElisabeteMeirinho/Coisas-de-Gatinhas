<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#63347f"><title>Filme · Meu Cantinho Felino</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#120d18;color:#fff;font:600 16px/1.45 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.wrap{width:min(1200px,100%);text-align:center}.brand{color:#f3c96b;letter-spacing:.14em;font-size:.78rem}.title{font-size:clamp(1.4rem,4vw,2.3rem);margin:8px 0 5px}.desc{color:#e9d9f2;margin:0 0 18px}.screen{position:relative;width:100%;aspect-ratio:16/9;background:#050407;border:1px solid #a879c7;border-radius:16px;overflow:hidden;box-shadow:0 14px 60px #0009}.screen img,.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}.screen video{display:none}.screen.playing img{display:none}.screen.playing video{display:block}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px #0005}.controls{display:flex;justify-content:center;gap:12px;margin-top:18px}.button{border:0;border-radius:99px;background:#f3c96b;color:#442653;padding:12px 24px;font:900 1rem system-ui;cursor:pointer}.back{background:#6c4b7b;color:white;text-decoration:none;display:inline-flex;align-items:center;border-radius:99px;padding:12px 20px}.note{color:#cdb9d8;font-size:.8rem;margin-top:12px}.progress{height:3px;background:#ffffff20;border-radius:99px;margin-top:12px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#f3c96b}@media(max-width:650px){body{padding:10px}.screen{border-radius:8px}.controls{flex-wrap:wrap}}
</style></head><body><main class="wrap"><div class="brand">🐾 PATINHAS PLAY · APRESENTA</div><h1 class="title">Meu Cantinho Felino — A Casa dos Recomeços</h1><p class="desc">Uma sequência cinematográfica contínua · Capítulo 1</p>
<div class="screen" id="screen"><img src="assets/cinematics/cena-01-casa-janela-azul.webp" alt="A casa da janela azul"><video id="film" playsinline preload="auto" muted></video></div>
<div class="progress"><i id="progress"></i></div><div class="controls"><button class="button" id="start">▶ Assistir filme</button><a class="back" href="index.html">Voltar ao jogo</a></div><p class="note" id="note">As cenas são reproduzidas automaticamente, sem avançar ou pular.</p></main>
<script>
(()=>{const files=['assets/cinematics/cena-02-chegada-suspiro.mp4','assets/cinematics/cena-03-descoberta-carta.mp4'];const screen=document.getElementById('screen'),video=document.getElementById('film'),start=document.getElementById('start'),progress=document.getElementById('progress'),note=document.getElementById('note');let index=0,done=false;const playNext=()=>{if(index>=files.length){done=true;note.textContent='Fim do capítulo de abertura. 💜';start.textContent='Assistir novamente';start.hidden=false;return}video.src=files[index++];screen.classList.add('playing');video.play().then(()=>{start.hidden=true;note.textContent='A história está acontecendo…'}).catch(()=>{start.hidden=false;start.textContent='Toque para iniciar o filme'})};video.addEventListener('ended',playNext);video.addEventListener('timeupdate',()=>{const duration=video.duration||1;progress.style.width=(((index-1)+video.currentTime/duration)/files.length*100)+'%'});start.addEventListener('click',()=>{if(done){index=0;done=false;progress.style.width='0';screen.classList.remove('playing');video.pause();video.removeAttribute('src');video.load()}playNext()})})();
</script></body></html>
