<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#63347f"><title>Meu Cantinho Felino · Filme de abertura</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#160e1c;color:#fff7ec;font:600 16px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}.top{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.top b{color:#f3c96b}.top a{color:#fff7ec;text-decoration:none}.screen{width:min(1200px,calc(100% - 28px));margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 24px}.frame{width:100%;aspect-ratio:16/9;background:#08060b;border-radius:14px;overflow:hidden;display:grid;place-items:center;box-shadow:0 12px 45px #0008}.frame img,.frame video{width:100%;height:100%;object-fit:contain;display:block}.caption{text-align:center;min-height:2em;color:#f8eefa}.start{border:0;border-radius:99px;background:#f3c96b;color:#442653;padding:13px 24px;font:inherit;font-weight:900;cursor:pointer}.note{font-size:13px;color:#cbb8d3;text-align:center}@media(max-width:650px){.top{padding:12px}.screen{width:calc(100% - 16px)}.frame{aspect-ratio:9/16;max-height:72vh}.frame img,.frame video{object-fit:contain}}
</style></head><body><div class="top"><b>🐾 PATINHAS PLAY · MEU CANTINHO FELINO</b><a href="index.html">← Voltar ao jogo</a></div><main class="screen"><div class="frame" id="frame"><img src="assets/cinematics/cena-01-casa-janela-azul.webp" alt="A casa da janela azul"></div><div class="caption" id="caption">A Casa dos Recomeços · Filme de abertura</div><button class="start" id="start">▶ Assistir abertura</button><p class="note">As três cenas são reproduzidas em sequência, sem opção de pular ou avançar manualmente.</p></main><script>
const scenes=[{type:'image',src:'assets/cinematics/cena-01-casa-janela-azul.webp',text:'Na Vila dos Ipês, uma casa antiga aguardava por um novo começo.'},{type:'video',src:'assets/cinematics/cena-02-chegada-suspiro.mp4',text:'Um dia, Suspiro encontrou o caminho até aquela casa.'},{type:'video',src:'assets/cinematics/cena-03-descoberta-carta.mp4',text:'Lá dentro, uma carta guardava a história daquele lugar.'}];
const frame=document.getElementById('frame'),caption=document.getElementById('caption'),button=document.getElementById('start');let i=0;
function playScene(){const s=scenes[i];caption.textContent=s.text;frame.replaceChildren();if(s.type==='image'){const img=new Image();img.src=s.src;img.alt='A casa da janela azul';img.onload=()=>setTimeout(next,4200);frame.append(img)}else{const v=document.createElement('video');v.src=s.src;v.autoplay=true;v.muted=true;v.playsInline=true;v.preload='auto';v.controls=false;v.addEventListener('ended',next,{once:true});frame.append(v);v.play().catch(()=>{caption.textContent='Toque em Assistir abertura para iniciar.';button.hidden=false})}}
function next(){i++;if(i<scenes.length)playScene();else{caption.textContent='A história está apenas começando…';button.hidden=false;button.textContent='Voltar ao jogo';button.onclick=()=>location.href='index.html'}}
button.onclick=()=>{button.hidden=true;i=0;playScene()};
</script></body></html>
