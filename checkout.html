<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Coisas de Gatinhas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="coisasdegatinhasstyle.css"></head><body>
<header class="topo"><a class="marca marca-logo-link" href="coisasdegatinhasindex.html"><img class="marca-logo" src="assets/logo-coisas-de-gatinhas.jpeg" alt="Coisas de Gatinhas"></a><a class="voltar-checkout" href="coisasdegatinhasindex.html">Continuar comprando</a></header>
<main class="checkout-pagina"><section><span class="tag">sua sacola</span><h1>Finalizar compra</h1><div id="itensCheckout" class="itens-checkout"></div></section><aside class="checkout-card"><h2>Entrega</h2><div class="form-checkout"><label>Nome<input id="nome" type="text" placeholder="Seu nome"></label><label>E-mail<input id="email" type="email" placeholder="voce@email.com"></label><label>CEP<input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000"></label><button class="btn btn-claro" id="calcularFrete" type="button">Calcular entrega pelo CEP</button><small id="enderecoCep" class="cep-endereco"></small><details class="uf-fallback"><summary>Não conseguiu localizar o CEP?</summary><label>Selecione o estado manualmente<select id="uf"><option value="">Selecione a UF</option></select></label></details><small id="fretePrazo" class="frete-prazo"></small></div><div class="cupom-box"><label>Cupom de desconto<div class="cupom-linha"><input id="cupom" placeholder="Ex.: GATINHA10"><button id="aplicarCupom" class="btn btn-claro" type="button">Aplicar</button></div></label><small id="cupomMensagem"></small></div><div class="resumo-valores"><div><span>Produtos</span><strong id="subtotal">A confirmar</strong></div><div><span>Desconto</span><strong id="desconto">—</strong></div><div><span>Frete</span><strong id="frete">A calcular</strong></div><div class="total-linha"><span>Total</span><strong id="total">A confirmar</strong></div></div><div class="pagamento-box"><div class="pix-titulo"><span>◆</span><div><strong>Pagamento via Pix</strong><small>O valor inclui desconto e frete calculado.</small></div></div><button class="btn" id="gerarPix" type="button">Gerar Pix</button><div id="pixArea"></div></div></aside></main>
<script src="produtos.js"></script><script src="checkout.js"></script></body></html>
